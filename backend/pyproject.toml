[project]
name = "superhuman-alpha-fund"
version = "0.1.0"
description = "Superhuman Alpha Fund – Autonomous Investment Analysis System"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.115",
    "uvicorn[standard]>=0.34",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "celery[redis]>=5.4",
    "redis>=5.0",
    "chromadb>=0.5",
    "langchain-anthropic>=0.3",
    "langgraph>=0.2",
    "langgraph-supervisor>=0.0.7",
    "langchain-core>=0.3",
    "yfinance>=0.2",
    "httpx>=0.28",
    "pyfin-sentiment>=0.1",
    "transformers>=4.47",
    "torch>=2.0",
    "beautifulsoup4>=4.12",
    "lxml>=5.3",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    "plotly>=5.24",
    "structlog>=24.4",
    "tenacity>=9.0",
    "python-multipart>=0.0.18",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "aiosqlite>=0.20",
    "httpx>=0.28",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"
