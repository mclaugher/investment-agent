name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest + ruff)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"

      # Style gates are advisory while the legacy codebase is brought into line.
      - name: Ruff lint (advisory)
        continue-on-error: true
        run: ruff check .
      - name: Ruff format check (advisory)
        continue-on-error: true
        run: ruff format --check .

      # Correctness gates — these fail the build.
      - name: Tests (tools / services / api)
        run: pytest tests/test_tools tests/test_services tests/test_api -v
      - name: Agent tests (advisory — may require API access)
        continue-on-error: true
        run: pytest tests/test_agents -v -k "not slow"

  frontend:
    name: Frontend (build + eslint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        # No lockfile is committed, so use install rather than ci.
        run: npm install
      # Correctness gate — runs tsc -b && vite build.
      - name: Build
        run: npm run build
      - name: Lint (advisory)
        continue-on-error: true
        run: npm run lint
